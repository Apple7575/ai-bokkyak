<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 중… — 모두의 복약</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<style>
  :root{--navy:#102A5E;--blue:#2563EB;--muted:#64748B;--bg:#EEF5FF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
       color:var(--navy);text-align:center;padding:24px}
  .box{max-width:420px}
  img{width:88px;height:88px;margin-bottom:20px}
  h1{font-size:24px;font-weight:800}
  p{margin-top:12px;color:var(--muted);font-size:17px;line-height:1.7}
  .btn{display:inline-block;margin-top:24px;min-height:56px;padding:16px 28px;
       border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;
       font-size:17px;font-weight:700}
  .dots{margin-top:18px;display:flex;gap:8px;justify-content:center}
  .dot{width:9px;height:9px;border-radius:999px;background:#C3D6F5;animation:b 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,100%{opacity:.35}50%{opacity:1;background:var(--blue)}}
</style>
</head>
<body>
<div class="box">
  <img src="/logo.png" alt="모두의 복약">
  <h1 id="title">로그인 중이에요</h1>
  <p id="msg">잠시만 기다려 주세요. 앱으로 돌아갑니다.</p>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <a class="btn" id="open" href="#" hidden>앱으로 돌아가기</a>
</div>
<script>
  // 카카오 로그인 중계 페이지.
  //
  // 왜 필요한가: 카카오는 Redirect URI로 http/https만 받는다. 앱의 커스텀 스킴
  // (modubokyak://)을 직접 등록할 수 없으므로, 카카오는 이 페이지로 보내고
  // 이 페이지가 곧바로 앱 스킴으로 넘긴다. 인가 코드는 그대로 전달만 한다.
  //
  // 코드를 여기서 토큰으로 바꾸지 않는다 — 그건 서버(엣지 함수)가 한다.
  // 이 페이지는 시크릿을 갖고 있지 않다.
  (function () {
    var q = window.location.search || "";
    var target = "modubokyak://kakao-callback" + q;
    var link = document.getElementById("open");
    link.href = target;

    var params = new URLSearchParams(q);
    if (params.get("error")) {
      document.getElementById("title").textContent = "로그인이 취소됐어요";
      document.getElementById("msg").textContent = "앱으로 돌아가 다시 시도해 주세요.";
    }

    // 자동 이동. 브라우저가 막는 경우가 있어 버튼도 함께 노출한다.
    try { window.location.replace(target); } catch (e) {}
    setTimeout(function () { link.hidden = false; }, 1200);
  })();
</script>
</body>
</html>
